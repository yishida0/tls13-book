name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: listings/chap7/go.mod
          cache: false
      - run: |
          for d in listings/chap*/; do
            (cd "$d" && go test ./...)
          done
