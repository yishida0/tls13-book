<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 172" width="780" height="172" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="14">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/></marker>
  </defs>
  <rect width="780" height="172" fill="#ffffff"/>
  <text x="125" y="20" fill="#555555" text-anchor="middle" font-size="12">通信の時点</text>
  <text x="390" y="20" fill="#555555" text-anchor="middle" font-size="12">数年後</text>
  <text x="655" y="20" fill="#555555" text-anchor="middle" font-size="12">長期秘密鍵を手に入れた後</text>
  <line x1="12" y1="32" x2="764" y2="32" stroke="#999999" stroke-width="1.2" marker-end="url(#ahg)"/>
  <rect x="20" y="48" width="210" height="60" fill="#f3f3f3" stroke="#666666"/>
  <text x="125" y="73" fill="#333333" text-anchor="middle" font-size="13">ハンドシェイクと暗号文を</text>
  <text x="125" y="93" fill="#333333" text-anchor="middle" font-size="13">記録して保管する</text>
  <rect x="285" y="48" width="210" height="60" fill="#fff0ee" stroke="#c44b3f"/>
  <text x="390" y="73" fill="#333333" text-anchor="middle" font-size="13">サーバーの長期秘密鍵を</text>
  <text x="390" y="93" fill="#333333" text-anchor="middle" font-size="13">手に入れる</text>
  <rect x="550" y="48" width="210" height="60" fill="#fff0ee" stroke="#c44b3f"/>
  <text x="655" y="73" fill="#333333" text-anchor="middle" font-size="13">記録から共有秘密を求め、</text>
  <text x="655" y="93" fill="#333333" text-anchor="middle" font-size="13">記録した通信を読む</text>
  <line x1="230" y1="78" x2="281" y2="78" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="495" y1="78" x2="546" y2="78" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="125" y1="108" x2="125" y2="126" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
  <polygon points="30,130 250,130 240,162 20,162" fill="#ffffff" stroke="#999999"/>
  <text x="135" y="151" fill="#333333" text-anchor="middle" font-size="13">記録したハンドシェイクと暗号文</text>
  <path d="M 246 146 H 655 V 112" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
